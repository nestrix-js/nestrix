{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nestrix-server.postgresName" . }}
  labels:
    {{- include "nestrix-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "nestrix-server.postgresSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nestrix-server.postgresName" . }}
  labels:
    {{- include "nestrix-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nestrix-server.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "nestrix-server.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nestrix-server.postgresSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.postgresql.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # the postgres image's `postgres` user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "nestrix-server.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          args:
            {{- range $name, $value := .Values.postgresql.config }}
            - -c
            - {{ printf "%s=%s" $name $value | quote }}
            {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/nestrix/{{ .Values.existingSecret.keys.dbPassword }}
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: secrets
              mountPath: /run/secrets/nestrix
              readOnly: true
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "nestrix-server.secretName" . }}
            defaultMode: 0440
            # Only the database password: this pod must not see the dashboard password, the
            # ingest keys or the session secret that live in the same Secret.
            items:
              - key: {{ .Values.existingSecret.keys.dbPassword | quote }}
                path: {{ .Values.existingSecret.keys.dbPassword | quote }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
