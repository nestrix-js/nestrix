packages:
  - packages/*
  - apps/*
  - examples/*
  - spikes/*
  - benchmarks
  - e2e
  - docs-site
# D-51: fail an install that needs a too-new release instead of pnpm adding minimumReleaseAgeExclude entries itself.
minimumReleaseAgeStrict: true
allowBuilds:
  # docs-site (VitePress): esbuild resolves its platform binary without the postinstall.
  esbuild: false
  "@parcel/watcher": false
  "@swc/core": false
  # Optional native accelerator pulled in by bullmq (spikes/p0-s6); msgpackr falls back to pure JS.
  msgpackr-extract: false
  # apps/server proto generation only; its bin/buf shim resolves the platform binary without the postinstall.
  "@bufbuild/buf": false
# @fastify/helmet and @fastify/compress import `fastify` in their types without
# declaring it, so TypeScript finds whichever copy pnpm hoists (the lowest
# version installed). Declaring it as a peer makes each consumer's own copy win.
packageExtensions:
  "@fastify/helmet":
    peerDependencies:
      fastify: "^5.0.0"
  "@fastify/compress":
    peerDependencies:
      fastify: "^5.0.0"
# Dependabot: patched versions of dev/test-only transitive dependencies that the pinned
# older Nest versions (platform-express 12.0.0 and 12.3.0, spikes, docs-site) still resolve to.
overrides:
  "multer@<2.5.0": "^2.5.0"
  "qs@<6.16.1": "^6.16.1"
  "glob@>=9.0.0 <14.0.2": "^14.0.2"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  "esbuild@<0.25.0": "^0.25.0"
  "vite@<6.4.4": "^6.4.4"
