packages:
  - packages/*
  - apps/*
  - examples/*
  - spikes/*
  - benchmarks
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
# @fastify/helmet and @fastify/compress import `fastify` in their types without
# declaring it, so TypeScript finds whichever copy pnpm hoists (the lowest
# version installed). Declaring it as a peer makes each consumer's own copy win.
packageExtensions:
  "@fastify/helmet":
    peerDependencies:
      fastify: "^5.0.0"
  "@fastify/compress":
    peerDependencies:
      fastify: "^5.0.0"
