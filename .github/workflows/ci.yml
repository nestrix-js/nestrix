name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The architecture §8 matrix lives here, in one job per Node line. `pnpm verify` runs every
  # Vitest project, and three of them run the shared conformance files
  # (packages/nestjs/test/conformance-*.test.ts) against different Nest installs:
  #   @nestrix-js/nestjs                  Nest latest 12.x, Express + Fastify + platform-node
  #   @nestrix-js/conformance-nest12-0    Nest 12.0.0, Express + Fastify
  #   @nestrix-js/conformance-nest12-3-2  Nest 12.3.2, platform-node
  # So Node 26 (the engines floor, D-55) x Nest (12.0, 12.3.2, latest) x adapter is covered by these three
  # cells; a second matrix axis would run the same projects again.
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One Node line: the latest 26.x, which is also the engines floor (D-55).
        node: ["26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags: check:old-writer reads the previous release's source from its git tag.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Wait for Docker
        run: timeout 90 sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
      - run: pnpm verify
      # D-109: the previous release's inserts and upserts must still work on the new schema,
      # unless the migration is listed in apps/server/migrations/coordinated-stop.json.
      - name: Previous release's writers on the current schema
        run: pnpm check:old-writer --require-db
      # D-99 (issue #41): a report, never a failure; uses the build `pnpm verify` made.
      - name: Import cost of a disabled app (report only)
        continue-on-error: true
        run: |
          node scripts/measure-import-cost.mjs --runs 5 --modules | tee -a "$GITHUB_STEP_SUMMARY"

  # Packs both published packages, installs the tarballs outside the workspace into a fresh
  # ESM app and a fresh CommonJS app, and boots a trivial Nest 12 app in each.
  consume:
    name: consume (${{ matrix.format }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: esm, node: "26" }
          - { format: cjs, node: "26" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: Pack, install into a fresh app and boot it
        env:
          FORMAT: ${{ matrix.format }}
        run: .github/ci-fixtures/run.sh "$FORMAT" "$RUNNER_TEMP/consume-$FORMAT"

  # Two Nest services exporting to a Jaeger all-in-one started with docker compose; the script
  # asserts one trace holding service A's server and client spans and service B's server span.
  jaeger:
    name: jaeger trace check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter jaeger-example check

  # Issue #40: the Swarm stack and the Helm chart must render. No cluster is started.
  deploy-render:
    name: deploy files render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: helm lint deploy/helm/nestrix-server --set existingSecret.name=x
      - run: helm template t deploy/helm/nestrix-server --set existingSecret.name=x > /dev/null
      # Assertions on the rendered chart (deploy/helm/nestrix-server/README.md): the bundled
      # PostgreSQL pod mounts only the database password, and the server rolls without downtime.
      - name: Assert the rendered chart
        run: |
          helm template t deploy/helm/nestrix-server --set existingSecret.name=x > "$RUNNER_TEMP/chart.yaml"
          pg="$(awk '/^kind: StatefulSet/{f=1} f&&/^---/{f=0} f' "$RUNNER_TEMP/chart.yaml")"
          [ -n "$pg" ] || { echo "no StatefulSet rendered" >&2; exit 1; }
          items="$(printf '%s\n' "$pg" | grep -c '^ *- key: ')"
          [ "$items" = 1 ] || { echo "postgres pod projects $items secret keys, want 1" >&2; exit 1; }
          printf '%s\n' "$pg" | grep -q '^ *- key: "db-password"$' || { echo "postgres pod does not project db-password" >&2; exit 1; }
          dep="$(awk '/^kind: Deployment/{f=1} f&&/^---/{f=0} f' "$RUNNER_TEMP/chart.yaml")"
          printf '%s\n' "$dep" | grep -q '^    type: RollingUpdate$' || { echo "server strategy is not RollingUpdate" >&2; exit 1; }
          printf '%s\n' "$dep" | grep -q '^      maxUnavailable: 0$' || { echo "server maxUnavailable is not 0" >&2; exit 1; }
          printf '%s\n' "$dep" | grep -q '^      maxSurge: 1$' || { echo "server maxSurge is not 1" >&2; exit 1; }
      - run: helm template t deploy/helm/nestrix-server --set existingSecret.name=x --set postgresql.enabled=false --set ingress.enabled=true --set 'ingress.hosts={a.example.com}' > /dev/null
      - run: NESTRIX_DOMAIN=nestrix.example.com docker stack config -c deploy/swarm/stack.yml > /dev/null

  # The dashboard in a real browser against the example apps plus NestrixModule (e2e/): each test
  # boots an app as a child process, follows the startup link from its log and checks the UI.
  # Node 26 and Chromium only (private repository: Actions minutes are limited).
  e2e:
    name: e2e (chromium, node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The key carries the Playwright version pinned in e2e/package.json.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      # Downloads the browser only on a cache miss; the system libraries are installed every time.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, consume, jaeger, deploy-render, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed, was cancelled or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) exit 1 ;;
          esac
