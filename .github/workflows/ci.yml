name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The architecture §8 matrix lives here, in one job per Node line. `pnpm verify` runs every
  # Vitest project, and three of them run the shared conformance files
  # (packages/nestjs/test/conformance-*.test.ts) against different Nest installs:
  #   @nestrix/nestjs                  Nest latest 12.x, Express + Fastify + platform-node
  #   @nestrix/conformance-nest12-0    Nest 12.0.0, Express + Fastify
  #   @nestrix/conformance-nest12-3-2  Nest 12.3.2, platform-node
  # So Node (22.15, 24, 26) x Nest (12.0, 12.3.2, latest) x adapter is covered by these three
  # cells; a second matrix axis would run the same projects again.
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.15.0 is the engines floor, the first 22.x with require(esm) unflagged.
        node: ["22.15.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm verify

  # Packs both published packages, installs the tarballs outside the workspace into a fresh
  # ESM app and a fresh CommonJS app, and boots a trivial Nest 12 app in each.
  # CommonJS runs on 22.15.0 as well, because require(esm) behaves differently there.
  consume:
    name: consume (${{ matrix.format }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: esm, node: "26" }
          - { format: cjs, node: "22.15.0" }
          - { format: cjs, node: "26" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: Pack, install into a fresh app and boot it
        env:
          FORMAT: ${{ matrix.format }}
        run: .github/ci-fixtures/run.sh "$FORMAT" "$RUNNER_TEMP/consume-$FORMAT"

  # Two Nest services exporting to a Jaeger all-in-one started with docker compose; the script
  # asserts one trace holding service A's server and client spans and service B's server span.
  jaeger:
    name: jaeger trace check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter jaeger-example check

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, consume, jaeger]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
