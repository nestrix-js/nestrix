name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.15.0 is the engines floor, the first 22.x with require(esm) unflagged.
        node: ["22.15.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm verify

  # Packs both published packages, installs the tarballs outside the workspace into a fresh
  # ESM app and a fresh CommonJS app, and boots a trivial Nest 12 app in each.
  # CommonJS runs on 22.15.0 as well, because require(esm) behaves differently there.
  consume:
    name: consume (${{ matrix.format }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: esm, node: "26" }
          - { format: cjs, node: "22.15.0" }
          - { format: cjs, node: "26" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: Pack, install into a fresh app and boot it
        env:
          FORMAT: ${{ matrix.format }}
        run: .github/ci-fixtures/run.sh "$FORMAT" "$RUNNER_TEMP/consume-$FORMAT"

  # P0-S4 adds its top-level-await check for published entry points here (spike; not built yet).

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, consume]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
