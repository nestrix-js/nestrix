name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The architecture §8 matrix lives here, in one job per Node line. `pnpm verify` runs every
  # Vitest project, and three of them run the shared conformance files
  # (packages/nestjs/test/conformance-*.test.ts) against different Nest installs:
  #   @nestrix-js/nestjs                  Nest latest 12.x, Express + Fastify + platform-node
  #   @nestrix-js/conformance-nest12-0    Nest 12.0.0, Express + Fastify
  #   @nestrix-js/conformance-nest12-3-2  Nest 12.3.2, platform-node
  # So Node 26 (the engines floor, D-55) x Nest (12.0, 12.3.2, latest) x adapter is covered by these three
  # cells; a second matrix axis would run the same projects again.
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One Node line: the latest 26.x, which is also the engines floor (D-55).
        node: ["26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm verify

  # Packs both published packages, installs the tarballs outside the workspace into a fresh
  # ESM app and a fresh CommonJS app, and boots a trivial Nest 12 app in each.
  consume:
    name: consume (${{ matrix.format }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: esm, node: "26" }
          - { format: cjs, node: "26" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build
      - name: Pack, install into a fresh app and boot it
        env:
          FORMAT: ${{ matrix.format }}
        run: .github/ci-fixtures/run.sh "$FORMAT" "$RUNNER_TEMP/consume-$FORMAT"

  # Two Nest services exporting to a Jaeger all-in-one started with docker compose; the script
  # asserts one trace holding service A's server and client spans and service B's server span.
  jaeger:
    name: jaeger trace check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter jaeger-example check

  # The dashboard in a real browser against the example apps plus NestrixModule (e2e/): each test
  # boots an app as a child process, follows the startup link from its log and checks the UI.
  # Node 26 and Chromium only (private repository: Actions minutes are limited).
  e2e:
    name: e2e (chromium, node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The key carries the Playwright version pinned in e2e/package.json.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      # Downloads the browser only on a cache miss; the system libraries are installed every time.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, consume, jaeger, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
