name: Release

# Off by default. Every job is gated on the repository variable NPM_PUBLISH_ENABLED
# (Settings > Secrets and variables > Actions > Variables). While it is unset, a push to
# main starts this workflow and all jobs are skipped; no minutes are used and nothing can
# publish. The owner sets it to "true" only after the steps in RELEASING.md are done.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Publish the standalone server image for this existing release (for example 0.1.0).
          Empty: the version in packages/nestjs/package.json on the selected ref.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release halfway

jobs:
  select:
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.repository == 'nestrix-js/nestrix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Opens or updates the "chore(release): version packages" PR. No publish permissions here.
  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # RELEASE_PAT is optional: PRs opened with GITHUB_TOKEN do not trigger CI.
          github-token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        env:
          # @changesets/changelog-github reads PR numbers and authors from the GitHub API for the
          # "Thanks @user!" credits in the changelog.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after the version PR is merged. The only job with id-token: write.
  # No NPM_TOKEN or NODE_AUTH_TOKEN: npm and pnpm exchange the job's OIDC token themselves
  # (npm trusted publishing) and attach provenance.
  publish:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Not ./.github/actions/setup: a release build restores no cache.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Wait for Docker
        run: timeout 90 sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
      - run: pnpm verify # the same checks as CI: a release cannot skip any
      - id: changesets
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release

  # Builds apps/server/Dockerfile for amd64 and arm64 and pushes it to GHCR, after a publish
  # that released something, or on demand (workflow_dispatch) for an existing release. The
  # only job with packages: write. Image provenance and SBOM are BuildKit attestations stored
  # in the registry next to the image, so no attestations or id-token permission is needed.
  server-image:
    needs: [select, publish]
    # !cancelled(): a dispatch run skips `publish`, which would otherwise skip this job too.
    if: >-
      !cancelled() && vars.NPM_PUBLISH_ENABLED == 'true' && github.repository == 'nestrix-js/nestrix'
      && (needs.publish.outputs.published == 'true'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60 # arm64 runs under QEMU
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      IMAGE: ghcr.io/nestrix-js/nestrix-server
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      # An explicit version builds from that release's tag, not from the tip of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version && format('@nestrix-js/nestjs@{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./packages/nestjs/package.json').version")}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad version: $version" >&2; exit 1; }
          # The npm dist-tag: the Changesets pre tag for a prerelease, latest otherwise.
          if [[ "$version" == *-* ]]; then
            tag="$(node -p "require('./.changeset/pre.json').tag")"
          else
            tag=latest
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.title=nestrix-server
            org.opencontainers.image.description=Standalone Nestrix server: OTLP ingest, PostgreSQL storage and the dashboard
            org.opencontainers.image.source=https://github.com/nestrix-js/nestrix
            org.opencontainers.image.url=https://github.com/nestrix-js/nestrix
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
